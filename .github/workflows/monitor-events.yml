name: Monitor MBC Austin events

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

concurrency:
  group: mbc-austin-events-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Check events and post Discussion update
        run: python monitor.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFY_GITHUB_USERNAME: ${{ vars.NOTIFY_GITHUB_USERNAME }}
          DISCUSSION_CATEGORY_NAME: ${{ vars.DISCUSSION_CATEGORY_NAME }}

      - name: Save updated event state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "Event state is unchanged."
          else
            git commit -m "Update monitored event state"
            git push
          fi